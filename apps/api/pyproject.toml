[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcalbum-api"
version = "0.1.0"
description = "McAlbum FastAPI service"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.17,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.162,<0.163",
  "pillow>=12.2,<13",
  "pydantic-settings>=2.11,<3",
  "pymysql>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
